name: powershell-ci

# Static gates only: parse, ASCII/no-BOM and CRLF. Nothing here installs a policy.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  static:
    name: parse + encoding (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest ]
        shell: [ pwsh, powershell ]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - name: Print engine version
        run: $PSVersionTable | Out-String

      # Warns when this runs on Windows PowerShell 5.1 with a file that is not
      # pure ASCII (PS 5.1 reads BOM-less non-ASCII as Windows-1252 and mangles it).
      - name: Parse check every .ps1
        run: |
          $bad = 0
          Get-ChildItem -Path . -Recurse -Filter '*.ps1' -File | Sort-Object FullName | ForEach-Object {
            $rel = Resolve-Path -Relative $_.FullName
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $bad++
              Write-Host "::error file=$rel::parse failure: $($errors[0].Message) (line $($errors[0].Extent.StartLineNumber))"
              $errors | Select-Object -First 5 | ForEach-Object { Write-Host "   line $($_.Extent.StartLineNumber): $($_.Message)" }
            } else {
              Write-Host "parse OK  $rel"
            }
          }
          if ($bad -gt 0) { Write-Host "FAILED: $bad file(s) do not parse"; exit 1 }
          Write-Host 'all PowerShell files parse'

      # House rule: .ps1 must be pure ASCII with no BOM (PS 5.1 / Windows-1252).
      # .bat must be pure ASCII, no BOM, CRLF only (cmd.exe's LF tolerance is undocumented).
      # Also scans for control bytes < 32 other than tab/CR/LF - the class of bug that
      # turned a path into 'policy<VT>ariants' when a script was edited via Python strings.
      - name: Encoding / ASCII / CRLF audit
        run: |
          $fail = @()
          function Get-ControlBytes([byte[]]$bytes) {
            @($bytes | Where-Object { $_ -lt 32 -and $_ -notin 9, 10, 13 })
          }
          foreach ($f in (Get-ChildItem -Path . -Recurse -Filter '*.ps1' -File)) {
            $rel = Resolve-Path -Relative $f.FullName
            $b = [System.IO.File]::ReadAllBytes($f.FullName)
            $nonAscii = @($b | Where-Object { $_ -gt 127 })
            if ($nonAscii.Count -gt 0) { $fail += "${rel}: $($nonAscii.Count) non-ASCII byte(s)" }
            if ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF) { $fail += "${rel}: UTF-8 BOM" }
            $ctl = Get-ControlBytes $b
            if ($ctl.Count -gt 0) { $fail += "${rel}: control byte(s) $((($ctl | Select-Object -First 5) | ForEach-Object { '0x{0:X2}' -f $_ }) -join ',')" }
          }
          foreach ($f in (Get-ChildItem -Path . -Recurse -Filter '*.bat' -File)) {
            $rel = Resolve-Path -Relative $f.FullName
            $b = [System.IO.File]::ReadAllBytes($f.FullName)
            $nonAscii = @($b | Where-Object { $_ -gt 127 })
            if ($nonAscii.Count -gt 0) { $fail += "${rel}: $($nonAscii.Count) non-ASCII byte(s)" }
            if ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF) { $fail += "${rel}: UTF-8 BOM" }
            $lf = ($b | Where-Object { $_ -eq 10 }).Count
            $crlf = 0
            for ($i = 0; $i -lt $b.Length - 1; $i++) { if ($b[$i] -eq 13 -and $b[$i + 1] -eq 10) { $crlf++ } }
            if ($lf -ne $crlf) { $fail += "${rel}: $($lf - $crlf) bare LF line ending(s)" }
            $ctl = Get-ControlBytes $b
            if ($ctl.Count -gt 0) { $fail += "${rel}: control byte(s)" }
          }
          if ($fail.Count -gt 0) {
            $fail | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }
          Write-Host 'encoding audit clean'

      # The kit launchers auto-detect the newest versioned script next to them; a
      # mismatch between the .bat glob and the shipped filename breaks the
      # double-click route silently, so assert the contract.
      - name: Launcher / versioned-filename contract
        run: |
          $fail = @()
          $expect = @{
            'kits/1/Block-The-Programs.bat'                           = 'Block-The-Programs.v*.ps1'
            'kits/2/Block-The-Websites.bat'                           = 'Block-The-Websites.v*.ps1'
            'kits/windows-only/Remote-Tools-Block-Windows.bat'        = 'Remote-Tools-Block-Windows.v*.ps1'
            'src/appcontrol/Run-RmmAppControl.bat'                    = 'Install-RmmAppControl.v*.ps1'
            'src/eset/Run-LolrmmUrlList.bat'                          = 'Get-LolrmmUrlList.v*.ps1'
            'src/eset/Run-LolrmmHipsList.bat'                         = 'Get-LolrmmHipsList.v*.ps1'
            'revert/Run-Revert.bat'                                   = 'Revert-RemoteAccessBlock.v*.ps1'
          }
          foreach ($bat in $expect.Keys) {
            if (-not (Test-Path $bat)) { $fail += "${bat}: missing"; continue }
            $text = Get-Content -Raw $bat
            if ($text -notlike "*$($expect[$bat])*") {
              $fail += "${bat}: does not reference '$($expect[$bat])'"
            }
            $dir = Split-Path $bat -Parent
            if (-not (Get-ChildItem -Path $dir -Filter $expect[$bat] -File -ErrorAction SilentlyContinue)) {
              $fail += "${bat}: no file matching '$($expect[$bat])' in $dir"
            }
          }
          # the shared core must exist exactly once
          foreach ($core in 'Build-RmmAppControl.v*.ps1', 'Install-RmmAppControl.v*.ps1') {
            $found = @(Get-ChildItem -Path . -Recurse -Filter $core -File)
            if ($found.Count -ne 1) { $fail += "${core}: expected exactly 1 copy, found $($found.Count)" }
            else { Write-Host "$core -> $($found[0].FullName)" }
          }
          if ($fail.Count -gt 0) { $fail | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
          Write-Host 'launcher contract OK'

      # The Windows-only kit must never contain the ESET-capable revert script or the ESET
      # guide, and the full kit must carry exactly one variant of each kind. Shipping the
      # ESET script to a Windows-only deployment tells the operator to un-block something
      # that was never blocked.
      - name: Revert-variant allocation contract
        run: |
          $fail = @()
          $rev = @(Get-ChildItem -Path 'revert' -Filter '*.ps1' -File)
          $winOnly = @($rev | Where-Object { $_.Name -match '-WinOnly\.v' })
          $full    = @($rev | Where-Object { $_.Name -match 'Revert-RemoteAccessBlock\.v' })
          Write-Host "revert variants: $($winOnly.Count) WinOnly, $($full.Count) full"
          if ($winOnly.Count -ne 1) { $fail += "expected exactly 1 WinOnly variant, found $($winOnly.Count)" }
          if ($full.Count -ne 1)    { $fail += "expected exactly 1 full variant, found $($full.Count)" }

          # the WinOnly variant must not reference any ESET behaviour
          foreach ($f in $winOnly) {
            $text = Get-Content -Raw $f.FullName
            foreach ($pat in 'egui\.exe', 'eset-remove-guide', 'LOLRMM-UrlList', 'LOLRMM-HipsList',
                             'URL list management', 'List of blocked addresses',
                             'potentially unsafe applications', 'eset-lists') {
              if ($text -match $pat) { $fail += "$($f.Name): contains ESET behaviour /$pat/" }
            }
            # and it must still have a working dry run
            if ($text -notmatch '\[switch\]\$WhatIf') { $fail += "$($f.Name): no explicit -WhatIf switch" }
          }
          # the full variant must still carry the ESET handling and the dry run
          foreach ($f in $full) {
            $text = Get-Content -Raw $f.FullName
            if ($text -notmatch 'eset-remove-guide') { $fail += "$($f.Name): lost the ESET guide handling" }
            if ($text -notmatch '\[switch\]\$WhatIf') { $fail += "$($f.Name): no explicit -WhatIf switch" }
          }
          # no generated variant may keep its region markers
          foreach ($f in $rev) {
            $text = Get-Content -Raw $f.FullName
            if ($text -match '#region eset') { $fail += "$($f.Name): leftover generator marker" }
          }
          if ($fail.Count -gt 0) { $fail | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
          Write-Host 'revert-variant allocation OK'

      # policy/ is generated output; a malformed policy would fail at install time
      # on the user's PC, which is the worst place to find out.
      - name: Policy inventory check
        run: |
          $variants = @(Get-ChildItem -Path 'policy/variants' -Filter '*.cip' -File)
          Write-Host "variant .cip files: $($variants.Count) (expect 32)"
          $missing = @()
          foreach ($mode in 'Enforce', 'Audit') {
            foreach ($t in 0, 1) { foreach ($a in 0, 1) { foreach ($s in 0, 1) { foreach ($r in 0, 1) {
              $name = "RmmBlock-$mode-T$t`A$a`S$s`R$r.cip"
              if (-not (Test-Path "policy/variants/$name")) { $missing += $name }
            } } } }
          }
          if ($missing.Count -gt 0) { $missing | ForEach-Object { Write-Host "::error::missing policy variant $_" }; exit 1 }
          foreach ($f in 'policy/RmmBlock-Enforce.cip', 'policy/RmmBlock-Audit.cip', 'policy/signers.csv', 'policy/summary.txt') {
            if (-not (Test-Path $f)) { Write-Host "::error::missing $f"; exit 1 }
          }
          # no policy XML may name a deployment-specific org (public repo: keep it neutral)
          # built from parts on purpose: naming the literal here would defeat the check
          $orgName = 'Rubin' + 'IT'
          $bad = Select-String -Path 'policy/*.xml', 'policy/variants/*.xml' -Pattern $orgName -ErrorAction SilentlyContinue
          if ($bad) { Write-Host "::error::deployment-specific name found in policy XML"; exit 1 }
          Write-Host 'policy inventory OK'

      # The full kit is now two separate programs: folder 1 is the App Control (program) blocker, folder 2 is
      # the ESET (website) list. They must stay separable - shipping the ESET steps in program 1 (or App Control
      # in program 2) recreates the one-window-knob problem this split exists to remove.
      - name: Two-program split contract
        run: |
          $fail = @()
          $p1 = @(Get-ChildItem -Path 'kits/1' -Filter '*.ps1' -File)
          $p2 = @(Get-ChildItem -Path 'kits/2' -Filter '*.ps1' -File)
          if ($p1.Count -ne 1) { $fail += "kits/1: expected exactly 1 .ps1, found $($p1.Count)" }
          if ($p2.Count -ne 1) { $fail += "kits/2: expected exactly 1 .ps1, found $($p2.Count)" }

          # program 1 - the program blocker - must not mention anything ESET
          foreach ($f in $p1) {
            $text = Get-Content -Raw $f.FullName
            foreach ($pat in 'egui\.exe', 'Get-LolrmmUrlList', 'eset-blocked-urls', 'LOLRMM-UrlList',
                             'URL list management', 'List of blocked addresses', 'set-clipboard',
                             'potentially unsafe applications', 'HOW-TO-IMPORT') {
              if ($text -match $pat) { $fail += "$($f.Name): program 1 contains ESET behaviour /$pat/" }
            }
            foreach ($need in 'Install-RmmAppControl', 'RmmBlock', 'App Control') {
              if ($text -notmatch $need) { $fail += "$($f.Name): program 1 lost $need" }
            }
          }
          # program 2 - the ESET website list - must not touch App Control
          foreach ($f in $p2) {
            $text = Get-Content -Raw $f.FullName
            foreach ($pat in 'Install-RmmAppControl', 'Build-RmmAppControl', 'CiTool', 'ConvertFrom-CIPolicy',
                             'App Control', 'RmmBlock', 'CodeIntegrity') {
              if ($text -match $pat) { $fail += "$($f.Name): program 2 contains App Control behaviour /$pat/" }
            }
            foreach ($need in 'Get-LolrmmUrlList', 'eset-blocked-urls', 'HOW-TO-IMPORT') {
              if ($text -notmatch $need) { $fail += "$($f.Name): program 2 lost $need" }
            }
          }
          # the launchers must stay separate too: only program 1 elevates
          $b1 = Get-Content -Raw 'kits/1/Block-The-Programs.bat'
          $b2 = Get-Content -Raw 'kits/2/Block-The-Websites.bat'
          if ($b1 -notmatch 'RunAs') { $fail += 'kits/1: launcher does not elevate (program 1 needs admin)' }
          if ($b2 -match 'RunAs') { $fail += 'kits/2: launcher elevates (the ESET list program must not need admin)' }
          # the old combined window must be gone from both folders
          if (Test-Path 'kits/full') { $fail += 'kits/full still exists - the split should have replaced it' }
          if ($fail.Count -gt 0) { $fail | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
          Write-Host 'two-program split OK'