name: lolrmm-watch

# Weekly check of the LOLRMM catalogue (lolrmm.io/api/rmm_tools.json).
# If it changed, rerun our generators and open (or refresh) ONE pull request from bot/lolrmm-update
# that updates data/lolrmm-baseline/ - and policy/ only when the App Control deny rules changed.
# Nothing here installs anything; merging the PR is the human review step.
#
# Repo setting needed once: Settings > Actions > General > Workflow permissions >
# "Allow GitHub Actions to create and approve pull requests".
on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write   # to dispatch powershell-ci on the bot branch (PRs made with GITHUB_TOKEN trigger no CI)

concurrency:
  group: lolrmm-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Windows PowerShell 5.1: the generators target it, and ConfigCI (policy build) lives there.
      - name: Compare catalogue and refresh baseline
        id: diff
        shell: powershell
        run: ./build/Update-LolrmmBaseline.ps1 -ReportPath "$env:RUNNER_TEMP\lolrmm-report.md"

      - name: Job summary
        if: steps.diff.outputs.changed == 'true'
        shell: pwsh
        run: Get-Content -Raw "$env:RUNNER_TEMP\lolrmm-report.md" >> $env:GITHUB_STEP_SUMMARY

      - name: Open or update the pull request
        if: steps.diff.outputs.changed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.diff.outputs.sha }}
          REBUILT: ${{ steps.diff.outputs.policy_rebuilt }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-Native { & $args[0] @($args | Select-Object -Skip 1); if ($LASTEXITCODE) { throw "$($args -join ' ') failed ($LASTEXITCODE)" } }
          $branch = 'bot/lolrmm-update'
          $report = "$env:RUNNER_TEMP\lolrmm-report.md"
          $short = $env:SHA.Substring(0, 8)
          $title = if ($env:REBUILT -eq 'true') { "LOLRMM catalogue update ($short) - App Control rules changed" } else { "LOLRMM catalogue update ($short)" }

          Invoke-Native git config user.name 'github-actions[bot]'
          Invoke-Native git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          Invoke-Native git checkout -B $branch
          Invoke-Native git add -A data/lolrmm-baseline policy
          Invoke-Native git commit -m "chore: LOLRMM catalogue update ($short)" -m "Catalogue SHA256 $env:SHA. Generated by the lolrmm-watch workflow."
          # rolling branch: always rebuilt from main, so a force push is expected
          Invoke-Native git push --force origin $branch

          $pr = gh pr list --head $branch --base main --state open --json number --jq '.[0].number'
          if ($pr) {
            Invoke-Native gh pr edit $pr --title $title --body-file $report
            Write-Host "Updated PR #$pr"
          } else {
            Invoke-Native gh pr create --base main --head $branch --title $title --body-file $report
          }
          Invoke-Native gh workflow run powershell-ci.yml --ref $branch
